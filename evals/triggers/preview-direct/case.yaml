schema_version: "1.1"
name: preview-direct
tags: [triggers, core, situation, preview]
execution:
  prompt: "I have an idea for a habit tracker app. Help me design it before we write any code."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: preview-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?preview"'
