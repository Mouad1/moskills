schema_version: "1.1"
name: gatekeeper-ship
tags: [triggers, gatekeeper]
execution:
  prompt: "I think the feature is finished. Is it ready to ship?"
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: gatekeeper-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gatekeeper"'
