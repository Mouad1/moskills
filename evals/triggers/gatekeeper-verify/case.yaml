schema_version: "1.1"
name: gatekeeper-verify
tags: [triggers, gatekeeper]
execution:
  prompt: "Before I open the PR, make sure everything actually passes."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: gatekeeper-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gatekeeper"'
