schema_version: "1.1"
name: collision-feature-not-diagnose
tags: [triggers, harder, collision]
execution:
  prompt: "Add a 10% discount on orders over 100 dollars."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-diagnose
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose"'
    min: 0
    max: 0
    arm: both
