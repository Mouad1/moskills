schema_version: "1.1"
name: handoff-indirect
tags: [triggers, harder, handoff]
execution:
  prompt: "My laptop battery is about to die, save where we are."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: handoff-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
