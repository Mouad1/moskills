schema_version: "1.1"
name: collision-single-review-not-council-loop
tags: [triggers, harder, collision, council-loop]
execution:
  prompt: "Take a quick look at this diff and tell me if you see any bugs."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-council-loop
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?council-loop"'
    min: 0
    max: 0
    arm: both
