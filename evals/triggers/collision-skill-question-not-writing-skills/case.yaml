schema_version: "1.1"
name: collision-skill-question-not-writing-skills
tags: [triggers, harder, collision, writing-skills]
execution:
  prompt: "Which skills does moskills ship?"
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-writing-skills
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-skills"'
    min: 0
    max: 0
    arm: both
