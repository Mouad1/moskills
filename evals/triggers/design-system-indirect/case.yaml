schema_version: "1.1"
name: design-system-indirect
tags: [triggers, harder, situation, design-system]
execution:
  prompt: "Every screen in the app uses slightly different grays and button sizes."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: design-system-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-system"'
