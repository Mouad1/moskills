schema_version: "1.1"
name: collision-continue-not-handoff
tags: [triggers, harder, collision]
execution:
  prompt: "Continue this list with three more fruits: apples, pears,"
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-handoff
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
    min: 0
    max: 0
    arm: both
