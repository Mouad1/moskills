schema_version: "1.1"
name: shared-language-indirect
tags: [triggers, harder, situation, shared-language]
execution:
  prompt: "The domain experts keep saying settlement and payout, and I can't tell if they mean the same thing."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: shared-language-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shared-language"'
