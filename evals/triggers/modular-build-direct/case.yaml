schema_version: "1.1"
name: modular-build-direct
tags: [triggers, core, situation, modular-build]
execution:
  prompt: "Build the invoicing app in modules, one at a time, and let me accept each one before the next."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: modular-build-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?modular-build"'
