schema_version: "1.1"
name: evolvebook-indirect
tags: [triggers, harder, evolvebook]
execution:
  prompt: "This is the third LinkedIn post I write with you this month. Keep a guide for these posts so each one gets better and never repeats an old angle."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: evolvebook-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?evolvebook"'
