schema_version: "1.1"
name: handoff-resume
tags: [triggers, handoff]
execution:
  prompt: "Pick up where we left off last session."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: handoff-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
