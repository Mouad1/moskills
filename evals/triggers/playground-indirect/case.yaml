schema_version: "1.1"
name: playground-indirect
tags: [triggers, harder, playground]
execution:
  prompt: "I can't picture how the retry delay grows with the base delay and the multiplier. Let me play with the numbers."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: playground-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?playground"'
