schema_version: "1.1"
name: playground-direct
tags: [triggers, playground]
execution:
  prompt: "Make me a page with sliders to compare the monthly cost of three hosting plans as my traffic grows."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: playground-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?playground"'
