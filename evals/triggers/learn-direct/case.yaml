schema_version: "1.1"
name: learn-direct
tags: [triggers, core, situation, learn]
execution:
  prompt: "Remember this: never use default exports in this repo. Make it a rule."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: learn-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?learn"'
