schema_version: "1.1"
name: design-system-direct
tags: [triggers, core, situation, design-system]
execution:
  prompt: "Pick the colors, type scale and spacing for our dashboard UI and keep them in one place."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: design-system-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-system"'
