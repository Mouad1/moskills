schema_version: "1.1"
name: shared-language-direct
tags: [triggers, core, situation, shared-language]
execution:
  prompt: "Set up a glossary: the team says order, basket and cart for the same thing."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: shared-language-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shared-language"'
