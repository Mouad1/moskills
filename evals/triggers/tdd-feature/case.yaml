schema_version: "1.1"
name: tdd-feature
tags: [triggers, tdd]
execution:
  prompt: "Add a function that gives a 10% discount on orders over 100 euros."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: tdd-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tdd"'
