schema_version: "1.1"
name: gatekeeper-done
tags: [triggers, gatekeeper]
execution:
  prompt: "Can we call this done? Check before I merge the branch."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: gatekeeper-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gatekeeper"'
