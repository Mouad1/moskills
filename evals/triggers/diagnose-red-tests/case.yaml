schema_version: "1.1"
name: diagnose-red-tests
tags: [triggers, diagnose]
execution:
  prompt: "The tests were green yesterday and now they are red. Find out what happened."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: diagnose-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose"'
