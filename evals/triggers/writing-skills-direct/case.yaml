schema_version: "1.1"
name: writing-skills-direct
tags: [triggers, writing-skills]
execution:
  prompt: "Write a new skill that makes the agent run the linter before every commit."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: writing-skills-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-skills"'
