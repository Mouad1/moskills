schema_version: "1.1"
name: evolvebook-new
tags: [triggers, evolvebook]
execution:
  prompt: "Create an evolvebook for my weekly newsletter."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: evolvebook-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?evolvebook"'
