schema_version: "1.1"
name: council-loop-indirect
tags: [triggers, harder, council-loop]
execution:
  prompt: "Before I merge, get reviewers from a few different AI providers on this diff and keep fixing until they all agree."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: council-loop-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?council-loop"'
