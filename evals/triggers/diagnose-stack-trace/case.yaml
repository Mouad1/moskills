schema_version: "1.1"
name: diagnose-stack-trace
tags: [triggers, diagnose]
execution:
  prompt: "npm test fails: AssertionError [ERR_ASSERTION]: 200 !== 800 at Object.<anonymous> (price.test.cjs:5:8). Why?"
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: diagnose-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose"'
