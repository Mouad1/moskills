schema_version: "1.1"
name: preview-indirect
tags: [triggers, harder, situation, preview]
execution:
  prompt: "Thinking about adding team workspaces to the product. Not sure yet what it should look like."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: preview-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?preview"'
