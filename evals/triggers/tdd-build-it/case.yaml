schema_version: "1.1"
name: tdd-build-it
tags: [triggers, harder, tdd]
execution:
  prompt: "Plan approved: a function that gives 10% off orders over 100 euros, in discount.js. Build it."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: tdd-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?tdd"'
