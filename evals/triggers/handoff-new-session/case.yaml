schema_version: "1.1"
name: handoff-new-session
tags: [triggers, handoff]
execution:
  prompt: "I am switching to a new session soon, write down where we are and the next step."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: handoff-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
