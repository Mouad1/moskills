schema_version: "1.1"
name: collision-fact-not-playground
tags: [triggers, harder, collision, playground]
execution:
  prompt: "What does exponential backoff mean? One sentence."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-playground
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?playground"'
    min: 0
    max: 0
    arm: both
