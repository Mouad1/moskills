schema_version: "1.1"
name: diagnose-indirect
tags: [triggers, harder, diagnose]
execution:
  prompt: "Customers say checkout charges the wrong total since this morning deploy."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: diagnose-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose"'
