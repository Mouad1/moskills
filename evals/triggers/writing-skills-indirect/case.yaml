schema_version: "1.1"
name: writing-skills-indirect
tags: [triggers, harder, writing-skills]
execution:
  prompt: "The handoff skill fires on requests that have nothing to do with it. Tighten when it runs and prove the change works."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: writing-skills-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?writing-skills"'
