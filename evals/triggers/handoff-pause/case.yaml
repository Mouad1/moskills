schema_version: "1.1"
name: handoff-pause
tags: [triggers, handoff]
execution:
  prompt: "I have to stop for today. Hand this off so I can continue tomorrow."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: handoff-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?handoff"'
