schema_version: "1.1"
name: modular-build-indirect
tags: [triggers, harder, situation, modular-build]
execution:
  prompt: "This app has auth, billing and a dashboard. I want to check each part works before we move on."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: modular-build-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?modular-build"'
