schema_version: "1.1"
name: collision-question-not-gatekeeper
tags: [triggers, harder, collision]
execution:
  prompt: "In moskills, what does the word done mean for a run?"
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-gatekeeper
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gatekeeper"'
    min: 0
    max: 0
    arm: both
