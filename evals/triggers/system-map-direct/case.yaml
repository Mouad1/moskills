schema_version: "1.1"
name: system-map-direct
tags: [triggers, core, situation, system-map]
execution:
  prompt: "Map how the modules in this repo depend on each other before I change the auth code."
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: system-map-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?system-map"'
